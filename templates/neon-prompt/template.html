<table cellpadding="0" cellspacing="0" border="0" width="460" style="border-collapse:collapse;background:{{bg}};font-family:{{font}};">
<tr><td style="padding:16px 20px 4px;font-size:12px;line-height:18px;color:{{muted}};">&gt; whoami</td></tr>
<tr><td style="padding:0 20px 2px;font-size:22px;line-height:30px;font-weight:bold;color:{{text}};">{{name}}<img src="{{siteUrl}}/anim/cursor.gif?c={{accentHex}}&amp;bg={{bgHex}}" width="9" height="16" alt="" style="display:inline-block;vertical-align:middle;border:0;margin-left:6px;"></td></tr>
<tr><td style="padding:0 20px 10px;font-size:13px;line-height:20px;color:{{accent}};">{{title}}{{#company}} @ {{company}}{{/company}}{{#tagline}}<br><span style="color:{{muted}};"># {{tagline}}</span>{{/tagline}}</td></tr>
<tr><td style="padding:0;font-size:0;line-height:0;"><img src="{{siteUrl}}/anim/scan.gif?w=460&amp;c={{accentHex}}&amp;bg={{bgHex}}" width="460" height="3" alt="" style="display:block;border:0;width:460px;height:3px;"></td></tr>
<tr><td style="padding:12px 20px;font-size:12px;line-height:21px;color:{{text}};">
{{#email}}<span style="color:{{accent}};">mail</span>&nbsp;&nbsp;<a href="{{emailHref}}" style="color:{{text}};text-decoration:none;">{{email}}</a><br>{{/email}}
{{#phone}}<span style="color:{{accent}};">tel</span>&nbsp;&nbsp;&nbsp;<a href="{{phoneHref}}" style="color:{{text}};text-decoration:none;">{{phone}}</a><br>{{/phone}}
{{#website}}<span style="color:{{accent}};">web</span>&nbsp;&nbsp;&nbsp;<a href="{{website}}" style="color:{{text}};text-decoration:none;">{{websiteLabel}}</a>{{/website}}
</td></tr>
{{#socials.length}}<tr><td style="padding:0 20px 16px;">{{#socials}}<a href="{{url}}" style="text-decoration:none;"><img src="{{icon}}" width="{{iconSize}}" height="{{iconSize}}" alt="{{label}}" style="display:inline-block;vertical-align:middle;border:0;width:{{iconSize}}px;height:{{iconSize}}px;"></a>&nbsp;&nbsp;{{/socials}}</td></tr>{{/socials.length}}
</table>
