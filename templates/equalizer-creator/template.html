<table cellpadding="0" cellspacing="0" border="0" width="440" style="border-collapse:separate;background:{{bg}};border-radius:10px;font-family:{{font}};">
<tr><td style="padding:18px 20px;">
<table cellpadding="0" cellspacing="0" border="0"><tr>
{{#photoUrl}}<td valign="top" style="padding:0 16px 0 0;"><img src="{{photoUrl}}" width="{{avatarSize}}" height="{{avatarSize}}" alt="{{name}}" style="display:block;border:0;width:{{avatarSize}}px;height:{{avatarSize}}px;border-radius:{{avatarRadius}};"></td>{{/photoUrl}}
<td valign="top">
<div style="font-size:20px;line-height:26px;font-weight:bold;color:{{text}};">{{name}}</div>
<div style="font-size:13px;line-height:19px;color:{{muted}};">{{title}}</div>
{{#tagline}}<div style="padding-top:6px;font-size:12px;line-height:20px;color:{{accent}};font-weight:bold;"><img src="{{siteUrl}}/anim/eq.gif?c={{accentHex}}&amp;bg={{bgHex}}" width="26" height="20" alt="" style="display:inline-block;vertical-align:middle;border:0;">&nbsp;{{tagline}}</div>{{/tagline}}
</td></tr></table>
<div style="padding-top:12px;font-size:12px;line-height:19px;color:{{text}};">{{#email}}<a href="{{emailHref}}" style="color:{{text}};text-decoration:none;">{{email}}</a>&nbsp;&nbsp;{{/email}}{{#website}}<a href="{{website}}" style="color:{{accent}};text-decoration:none;">{{websiteLabel}}</a>{{/website}}</div>
{{#ctaUrl}}<div style="padding-top:10px;"><a href="{{ctaUrl}}" style="display:inline-block;background:{{accent}};color:#18181b;text-decoration:none;font-size:12px;line-height:16px;font-weight:bold;padding:8px 16px;border-radius:20px;">{{ctaText}}{{^ctaText}}Listen now{{/ctaText}}</a></div>{{/ctaUrl}}
{{#socials.length}}<div style="padding-top:12px;">{{#socials}}<a href="{{url}}" style="text-decoration:none;"><img src="{{icon}}" width="{{iconSize}}" height="{{iconSize}}" alt="{{label}}" style="display:inline-block;vertical-align:middle;border:0;width:{{iconSize}}px;height:{{iconSize}}px;"></a>&nbsp;&nbsp;{{/socials}}</div>{{/socials.length}}
</td></tr>
</table>
