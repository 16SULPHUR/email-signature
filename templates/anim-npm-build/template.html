<table cellpadding="0" cellspacing="0" border="0" width="440" style="border-collapse:separate;border-spacing:0;background:{{bg}};border-radius:10px;font-family:{{font}};">
<tr><td colspan="2" style="padding:0;line-height:0;font-size:0;">{{#website}}<a href="{{website}}" style="text-decoration:none;">{{/website}}<img src="{{animUrl}}" width="440" height="184" alt="{{name}}{{#title}} · {{title}}{{/title}}" style="display:block;border:0;border-radius:10px 10px 0 0;width:440px;height:184px;">{{#website}}</a>{{/website}}</td></tr>
<tr><td style="border-top:1px solid #153c45;padding:9px 16px;font-size:12px;line-height:22px;color:{{text}};white-space:nowrap;">
{{#phone}}<a href="{{phoneHref}}" style="text-decoration:none;"><img src="{{phoneIcon}}" width="14" height="14" alt="" style="display:inline-block;vertical-align:middle;border:0;width:14px;height:14px;"></a>&nbsp;&nbsp;<a href="{{phoneHref}}" style="color:{{text}};text-decoration:none;">{{phone}}</a><br>{{/phone}}
{{#email}}<a href="{{emailHref}}" style="text-decoration:none;"><img src="{{emailIcon}}" width="14" height="14" alt="" style="display:inline-block;vertical-align:middle;border:0;width:14px;height:14px;"></a>&nbsp;&nbsp;<a href="{{emailHref}}" style="color:{{text}};text-decoration:none;">{{email}}</a><br>{{/email}}
{{#website}}<a href="{{website}}" style="text-decoration:none;"><img src="{{webIcon}}" width="14" height="14" alt="" style="display:inline-block;vertical-align:middle;border:0;width:14px;height:14px;"></a>&nbsp;&nbsp;<a href="{{website}}" style="color:{{text}};text-decoration:none;">{{websiteLabel}}</a>{{/website}}
</td><td align="right" valign="bottom" style="border-top:1px solid #153c45;padding:9px 16px;white-space:nowrap;">{{#socials}}<a href="{{url}}" style="text-decoration:none;"><img src="{{icon}}" width="{{iconSize}}" height="{{iconSize}}" alt="{{label}}" style="display:inline-block;vertical-align:middle;border:0;width:{{iconSize}}px;height:{{iconSize}}px;"></a>&nbsp;{{/socials}}</td></tr>
</table>
