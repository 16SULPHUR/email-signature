<table cellpadding="0" cellspacing="0" border="0" width="460" style="border-collapse:separate;border-spacing:0;background:{{bg}};border-radius:10px;font-family:{{font}};">
  <tr>
    <td colspan="2" style="padding:10px 16px 0 16px;font-size:0;line-height:0;">
      <span style="display:inline-block;width:10px;height:10px;border-radius:5px;background:#FF5F56;"></span>&nbsp;<span style="display:inline-block;width:10px;height:10px;border-radius:5px;background:#FFBD2E;"></span>&nbsp;<span style="display:inline-block;width:10px;height:10px;border-radius:5px;background:#27C93F;"></span>
    </td>
  </tr>
  <tr>
    <td colspan="2" style="padding:12px 16px 12px 16px;font-family:{{font}};font-size:13px;line-height:20px;color:{{text}};">
      <span style="color:{{accent}};">$</span> whoami<br>
      <span style="font-size:18px;line-height:28px;font-weight:bold;color:{{text}};">{{name}}</span><br>
      {{#title}}<span style="color:{{muted}};">#</span> {{title}}{{#company}} <span style="color:{{muted}};">@</span> {{company}}{{/company}}<br>{{/title}}
      {{#tagline}}<span style="color:{{muted}};">// {{tagline}}</span>{{/tagline}}
    </td>
  </tr>
  <tr>
    <td style="border-top:1px solid #24283B;padding:9px 16px;font-family:{{font}};font-size:12px;line-height:22px;color:{{text}};white-space:nowrap;">
      {{#phone}}<img src="{{phoneIcon}}" width="14" height="14" alt="" style="display:inline-block;vertical-align:middle;border:0;width:14px;height:14px;">&nbsp;&nbsp;<a href="{{phoneHref}}" style="color:{{text}};text-decoration:none;">{{phone}}</a><br>{{/phone}}
      {{#email}}<img src="{{emailIcon}}" width="14" height="14" alt="" style="display:inline-block;vertical-align:middle;border:0;width:14px;height:14px;">&nbsp;&nbsp;<a href="{{emailHref}}" style="color:{{text}};text-decoration:none;">{{email}}</a><br>{{/email}}
      {{#website}}<img src="{{webIcon}}" width="14" height="14" alt="" style="display:inline-block;vertical-align:middle;border:0;width:14px;height:14px;">&nbsp;&nbsp;<a href="{{website}}" style="color:{{accent}};text-decoration:none;">{{websiteLabel}}</a>{{/website}}
    </td>
    <td align="right" valign="bottom" style="border-top:1px solid #24283B;padding:9px 16px;white-space:nowrap;">
      {{#socials}}<a href="{{url}}" style="text-decoration:none;"><img src="{{icon}}" width="{{iconSize}}" height="{{iconSize}}" alt="{{label}}" style="display:inline-block;vertical-align:middle;border:0;width:{{iconSize}}px;height:{{iconSize}}px;"></a>&nbsp;{{/socials}}
    </td>
  </tr>
</table>
