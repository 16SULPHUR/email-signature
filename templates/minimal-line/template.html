<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:{{font}};color:{{text}};">
  <tr>
    <td style="padding:0 0 6px 0;font-size:17px;line-height:22px;color:{{text}};"><strong>{{name}}</strong>{{#title}}<span style="color:{{muted}};"> &nbsp;·&nbsp; {{title}}</span>{{/title}}</td>
  </tr>
  {{#company}}
  <tr>
    <td style="padding:0 0 8px 0;font-size:13px;line-height:18px;color:{{accent}};letter-spacing:1px;text-transform:uppercase;">{{company}}</td>
  </tr>
  {{/company}}
  <tr>
    <td style="padding:0;border-top:1px solid {{accent}};font-size:0;line-height:0;height:1px;" height="1">&nbsp;</td>
  </tr>
  <tr>
    <td style="padding:8px 0 0 0;font-size:13px;line-height:20px;color:{{muted}};">
      {{#phone}}<a href="{{phoneHref}}" style="color:{{muted}};text-decoration:none;">{{phone}}</a> &nbsp; {{/phone}}{{#email}}<a href="{{emailHref}}" style="color:{{muted}};text-decoration:none;">{{email}}</a> &nbsp; {{/email}}{{#website}}<a href="{{website}}" style="color:{{accent}};text-decoration:none;">{{websiteLabel}}</a>{{/website}}
    </td>
  </tr>
  {{#hasSocials}}
  <tr>
    <td style="padding:8px 0 0 0;font-size:0;line-height:0;">
      {{#socials}}<a href="{{url}}" style="text-decoration:none;display:inline-block;margin-right:8px;"><img src="{{icon}}" width="{{iconSize}}" height="{{iconSize}}" alt="{{label}}" style="display:inline-block;border:0;width:{{iconSize}}px;height:{{iconSize}}px;"></a>{{/socials}}
    </td>
  </tr>
  {{/hasSocials}}
</table>
