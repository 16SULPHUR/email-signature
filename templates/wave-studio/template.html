<table cellpadding="0" cellspacing="0" border="0" width="460" style="border-collapse:collapse;background:{{bg}};font-family:{{font}};">
<tr><td style="padding:0 0 14px;font-size:0;line-height:0;"><img src="{{siteUrl}}/anim/wave.gif?w=460&amp;c={{accentHex}}&amp;bg={{bgHex}}" width="460" height="6" alt="" style="display:block;border:0;width:460px;height:6px;"></td></tr>
<tr><td style="padding:0 2px;">
{{#logoUrl}}<img src="{{logoUrl}}" width="{{logoWidth}}" alt="{{company}}" style="display:block;border:0;width:{{logoWidth}}px;height:auto;margin-bottom:10px;">{{/logoUrl}}
<div style="font-size:22px;line-height:28px;font-weight:bold;letter-spacing:-0.5px;color:{{text}};">{{name}}</div>
<div style="font-size:13px;line-height:19px;color:{{muted}};">{{title}}{{#company}} — <span style="color:{{accent}};">{{company}}</span>{{/company}}</div>
{{#tagline}}<div style="padding-top:4px;font-size:13px;line-height:19px;font-style:italic;color:{{muted}};">{{tagline}}</div>{{/tagline}}
<div style="padding-top:10px;font-size:12px;line-height:19px;color:{{text}};">{{#phone}}<a href="{{phoneHref}}" style="color:{{text}};text-decoration:none;">{{phone}}</a>&nbsp;&nbsp;{{/phone}}{{#email}}<a href="{{emailHref}}" style="color:{{text}};text-decoration:none;">{{email}}</a>&nbsp;&nbsp;{{/email}}{{#website}}<a href="{{website}}" style="color:{{accent}};text-decoration:none;">{{websiteLabel}}</a>{{/website}}</div>
{{#socials.length}}<div style="padding-top:10px;">{{#socials}}<a href="{{url}}" style="text-decoration:none;"><img src="{{icon}}" width="{{iconSize}}" height="{{iconSize}}" alt="{{label}}" style="display:inline-block;vertical-align:middle;border:0;width:{{iconSize}}px;height:{{iconSize}}px;"></a>&nbsp;&nbsp;{{/socials}}</div>{{/socials.length}}
</td></tr>
<tr><td style="padding:14px 0 0;font-size:0;line-height:0;"><img src="{{siteUrl}}/anim/wave.gif?w=460&amp;c={{accentHex}}&amp;bg={{bgHex}}" width="460" height="6" alt="" style="display:block;border:0;width:460px;height:6px;"></td></tr>
</table>
